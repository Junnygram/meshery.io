# Harborlight — CloudNativePG production data service
# Author: Olaleye Oyewunmi
# Catalog type: Deployment
# Technologies: Kubernetes, CloudNativePG, AWS S3, Prometheus
#
# Catalog description:
# Harborlight is a production PostgreSQL data service on Kubernetes using the
# CloudNativePG operator. Three instances stream-replicate across zones.
# A PgBouncer Pooler sits in front so application connections survive
# failovers. ScheduledBackup ships WAL and base backups to S3 with a 30-day
# retention policy. NetworkPolicy allows 5432 only from labeled application
# namespaces. PodMonitor feeds Postgres metrics to Prometheus.
#
# Caveats:
# The CloudNativePG operator must already be installed. Replace the S3 bucket,
# IAM role, and storage class. Three instances need three zones; a single-AZ
# cluster will still schedule but loses the HA story. Pooler credentials are
# generated by the operator — do not commit application passwords into this
# design.

---
apiVersion: v1
kind: Namespace
metadata:
  name: harborlight
  labels:
    harborlight.io/role: data
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: harborlight-apps
  labels:
    harborlight.io/role: apps

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harborlight-pg
  namespace: harborlight
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/harborlight-pg-backup

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harborlight
  namespace: harborlight
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  storage:
    size: 100Gi
    storageClass: gp3-encrypted
  walStorage:
    size: 20Gi
    storageClass: gp3-encrypted
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      ssl: "on"
      wal_compression: "on"
  backup:
    barmanObjectStore:
      destinationPath: s3://harborlight-pg-backup/
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
    retentionPolicy: "30d"
  monitoring:
    enablePodMonitor: true
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/harborlight-pg-backup

---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: harborlight-rw
  namespace: harborlight
spec:
  cluster:
    name: harborlight
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
  template:
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: harborlight-rw

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harborlight-nightly
  namespace: harborlight
spec:
  cluster:
    name: harborlight
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: true
  method: barmanObjectStore
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: harborlight-bootstrap
  namespace: harborlight
spec:
  cluster:
    name: harborlight
  method: barmanObjectStore

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: payments
  namespace: harborlight
spec:
  name: payments
  owner: payments
  cluster:
    name: harborlight

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: harborlight
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-pooler
  namespace: harborlight
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: harborlight-rw
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              harborlight.io/role: apps
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pooler-to-cluster
  namespace: harborlight
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: harborlight
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: harborlight-rw
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-to-s3
  namespace: harborlight
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: harborlight
  policyTypes: ["Egress"]
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: harborlight
  namespace: harborlight
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: harborlight
  podMetricsEndpoints:
    - port: metrics

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harborlight
  namespace: harborlight
spec:
  minAvailable: 2
  selector:
    matchLabels:
      cnpg.io/cluster: harborlight
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harborlight-rw
  namespace: harborlight
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: harborlight-rw
