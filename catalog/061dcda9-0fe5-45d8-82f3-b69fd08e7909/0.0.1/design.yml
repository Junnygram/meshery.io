# Thrift — cost-aware EKS compute with Karpenter
# Author: Olaleye Oyewunmi
# Catalog type: Deployment
# Technologies: Kubernetes, Karpenter, AWS EKS, AWS EC2
#
# Catalog description:
# Thrift is a Karpenter compute plane for EKS that prefers Spot, falls back
# to on-demand, and consolidates empty or underutilized nodes. Two NodePools
# split general workloads from GPU-optional burst. EC2NodeClass pins AL2023,
# encrypted gp3, and discovery tags. A sample payments Deployment uses
# topology spread and a PodDisruptionBudget so consolidation never takes
# the last replica. This is the design the catalog is missing: Karpenter as
# a model exists, a well-architected NodePool design does not.
#
# Caveats:
# Replace ACCOUNT_ID, the IAM node role, and karpenter.sh/discovery tags
# with your cluster name. Spot interruption is expected — PDBs and topology
# spread are required, not optional. GPU NodePool is capacity-limited; leave
# it at limits.cpu: 16 until you have quota. Do not copy this into a cluster
# that still runs Cluster Autoscaler on the same nodes.

---
apiVersion: v1
kind: Namespace
metadata:
  name: thrift-workloads
  labels:
    thrift.io/plane: apps

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: thrift-al2023
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-thrift
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: thrift
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: thrift
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        iops: 3000
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
  tags:
    Name: thrift-karpenter
    managed-by: karpenter
    design: thrift

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: thrift-general
spec:
  weight: 10
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "10%"
  limits:
    cpu: "64"
    memory: 256Gi
  template:
    metadata:
      labels:
        thrift.io/pool: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: thrift-al2023
      expireAfter: 720h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      taints: []

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: thrift-burst
spec:
  weight: 1
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  limits:
    cpu: "16"
    memory: 64Gi
  template:
    metadata:
      labels:
        thrift.io/pool: burst
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: thrift-al2023
      expireAfter: 24h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7g.xlarge", "c7g.2xlarge", "c6i.xlarge", "c6i.2xlarge"]
      taints:
        - key: thrift.io/burst
          value: "true"
          effect: NoSchedule

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: thrift-steady
value: 1000
globalDefault: false
description: Steady application replicas that should survive consolidation.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: thrift-batch
value: 100
globalDefault: false
description: Interruptible batch that can run on the burst Spot pool.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: thrift-workloads
  labels:
    app.kubernetes.io/name: payments
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
    spec:
      priorityClassName: thrift-steady
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payments
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payments
      containers:
        - name: payments
          image: ghcr.io/example/payments:1.8.3
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: thrift-workloads
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments
  namespace: thrift-workloads
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments

---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-report
  namespace: thrift-workloads
spec:
  template:
    spec:
      priorityClassName: thrift-batch
      restartPolicy: OnFailure
      tolerations:
        - key: thrift.io/burst
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        thrift.io/pool: burst
      containers:
        - name: report
          image: ghcr.io/example/payments-report:1.1.0
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
