# Northstar — Internal developer platform
# Author: Olaleye Oyewunmi
# Catalog type: Deployment
# Technologies: Kubernetes, Backstage, Argo CD, External Secrets, Gateway API
#
# Catalog description:
# Northstar is an internal developer platform drawn as infrastructure as design.
# Backstage is the catalog and scaffolding UI. Argo CD ApplicationSets generate
# one Application per environment from the same Git repo. External Secrets
# injects the Git and OCI credentials so those never live in the design.
# Staging and production are separate namespaces with their own HTTPRoutes,
# which is the Meshery Environments story: one design, many targets.
#
# Caveats:
# Replace the Backstage image with the one your org builds (upstream has no
# single official runtime image). Point the ApplicationSet at a real repo.
# Argo CD itself is assumed already installed in argocd; this design is the
# platform layer on top, not a Helm dump of the Argo control plane.

---
apiVersion: v1
kind: Namespace
metadata:
  name: northstar-idp
  labels:
    northstar.io/plane: idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: northstar-staging
  labels:
    northstar.io/plane: apps
    northstar.io/environment: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: northstar-production
  labels:
    northstar.io/plane: apps
    northstar.io/environment: production

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: northstar-idp
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/northstar-backstage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: northstar-idp
  labels:
    app.kubernetes.io/name: backstage
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      serviceAccountName: backstage
      containers:
        - name: backstage
          image: ghcr.io/backstage/backstage:1.32.0
          ports:
            - containerPort: 7007
              name: http
          env:
            - name: APP_CONFIG_backend_DATABASE_CONNECTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: DATABASE_PASSWORD
            - name: APP_CONFIG_INTEGRATIONS_GITHUB_0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: northstar-idp
spec:
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: northstar
  namespace: northstar-idp
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: idp.northstar.example
      tls:
        mode: Terminate
        certificateRefs:
          - name: northstar-idp-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: northstar-idp
spec:
  parentRefs:
    - name: northstar
  hostnames:
    - idp.northstar.example
  rules:
    - backendRefs:
        - name: backstage
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-staging
  namespace: northstar-staging
spec:
  parentRefs:
    - name: northstar
      namespace: northstar-idp
  hostnames:
    - payments.staging.northstar.example
  rules:
    - backendRefs:
        - name: payments
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-production
  namespace: northstar-production
spec:
  parentRefs:
    - name: northstar
      namespace: northstar-idp
  hostnames:
    - payments.northstar.example
  rules:
    - backendRefs:
        - name: payments
          port: 8080

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: northstar-idp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backstage-secrets
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: northstar/backstage
        property: database_password
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: northstar/backstage
        property: github_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: repo-northstar-apps
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
  data:
    - secretKey: url
      remoteRef:
        key: northstar/argocd
        property: repo_url
    - secretKey: password
      remoteRef:
        key: northstar/argocd
        property: repo_token

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: northstar-workloads
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: staging
            namespace: northstar-staging
            autoSync: "true"
          - env: production
            namespace: northstar-production
            autoSync: "false"
  template:
    metadata:
      name: "payments-{{env}}"
    spec:
      project: northstar
      source:
        repoURL: https://github.com/example/northstar-apps.git
        targetRevision: main
        path: "apps/payments/overlays/{{env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-staging
  namespace: argocd
  labels:
    northstar.io/environment: staging
spec:
  project: northstar
  source:
    repoURL: https://github.com/example/northstar-apps.git
    targetRevision: main
    path: apps/payments/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: northstar-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-production
  namespace: argocd
  labels:
    northstar.io/environment: production
spec:
  project: northstar
  source:
    repoURL: https://github.com/example/northstar-apps.git
    targetRevision: main
    path: apps/payments/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: northstar-production
  syncPolicy: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: northstar-staging
  labels:
    app.kubernetes.io/name: payments
    northstar.io/environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/example/payments:1.8.3
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: northstar-staging
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: northstar-production
  labels:
    app.kubernetes.io/name: payments
    northstar.io/environment: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/example/payments:1.8.3
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: northstar-production
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments
  namespace: northstar-production
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
